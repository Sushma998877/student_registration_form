
name: SonarQube Cloud Analysis

on:
  push:
    branches:
      - feature/frontend
  pull_request:
    branches:
      - feature/frontend

permissions:
  contents: read

jobs:
  sonarqube:
    name: Tests, Coverage and SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Verify coverage report
        run: test -s coverage/lcov.info

     
      - name: Debug coverage report
        run: |
          echo "Checking LCOV report exists"
          ls -lh coverage/lcov.info

          echo "Checking line coverage records"
          grep -E '^(DA:|LF:|LH:)' coverage/lcov.info | head -n 30

          echo "Checking coverage summary"
          tail -n 30 coverage/lcov.info

      - name: Run SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
